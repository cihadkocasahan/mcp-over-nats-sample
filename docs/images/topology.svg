<svg xmlns="http://www.w3.org/2000/svg" width="960" height="460" viewBox="0 0 960 460" font-family="Segoe UI, Arial, sans-serif">
  <rect width="960" height="460" fill="#f8fafc"/>
  <text x="480" y="36" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">MCP over NATS — Topoloji</text>

  <!-- Bu PC -->
  <rect x="24" y="70" width="270" height="320" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="159" y="98" text-anchor="middle" font-size="16" font-weight="700" fill="#1d4ed8">BU PC (MCP istemcisi)</text>
  <rect x="54" y="120" width="210" height="64" rx="8" fill="#ffffff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="159" y="146" text-anchor="middle" font-size="15" font-weight="600" fill="#0f172a">İstemci</text>
  <text x="159" y="166" text-anchor="middle" font-size="12" fill="#475569">MCP destekli AI</text>
  <line x1="159" y1="184" x2="159" y2="230" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <text x="170" y="212" font-size="12" fill="#1d4ed8">stdio (JSON-RPC)</text>
  <rect x="54" y="232" width="210" height="64" rx="8" fill="#ffffff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="159" y="258" text-anchor="middle" font-size="15" font-weight="600" fill="#0f172a">local-proxy.exe</text>
  <text x="159" y="278" text-anchor="middle" font-size="12" fill="#475569">stdio ↔ NATS köprüsü</text>
  <text x="159" y="330" text-anchor="middle" font-size="12" fill="#475569">NATS_URL + NATS_CREDS</text>
  <text x="159" y="350" text-anchor="middle" font-size="12" fill="#475569">env ile yapılandırılır</text>

  <!-- NATS -->
  <rect x="360" y="120" width="240" height="220" rx="12" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2"/>
  <text x="480" y="150" text-anchor="middle" font-size="16" font-weight="700" fill="#6d28d9">NATS</text>
  <text x="480" y="176" text-anchor="middle" font-size="13" fill="#0f172a">Synadia Cloud</text>
  <text x="480" y="196" text-anchor="middle" font-size="12" fill="#475569">connect.ngs.global</text>
  <text x="480" y="216" text-anchor="middle" font-size="12" fill="#475569">TLS 4222 / WSS 443</text>
  <text x="480" y="248" text-anchor="middle" font-size="13" font-weight="600" fill="#6d28d9">subject: mcp.demo</text>
  <text x="480" y="278" text-anchor="middle" font-size="12" fill="#475569">veya yerel nats-server</text>
  <text x="480" y="298" text-anchor="middle" font-size="12" fill="#475569">nats://localhost:4222</text>

  <!-- Uzak PC -->
  <rect x="666" y="70" width="270" height="320" rx="12" fill="#f0fdf4" stroke="#22c55e" stroke-width="2"/>
  <text x="801" y="98" text-anchor="middle" font-size="16" font-weight="700" fill="#15803d">UZAK PC (MCP sunucusu)</text>
  <rect x="696" y="120" width="210" height="64" rx="8" fill="#ffffff" stroke="#22c55e" stroke-width="1.5"/>
  <text x="801" y="146" text-anchor="middle" font-size="15" font-weight="600" fill="#0f172a">remote-bridge.exe</text>
  <text x="801" y="166" text-anchor="middle" font-size="12" fill="#475569">NATS ↔ child süreç</text>
  <line x1="801" y1="184" x2="801" y2="230" stroke="#22c55e" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="812" y="212" font-size="12" fill="#15803d">stdio (JSON-RPC)</text>
  <rect x="696" y="232" width="210" height="64" rx="8" fill="#ffffff" stroke="#22c55e" stroke-width="1.5"/>
  <text x="801" y="258" text-anchor="middle" font-size="15" font-weight="600" fill="#0f172a">demo-server.exe</text>
  <text x="801" y="278" text-anchor="middle" font-size="12" fill="#475569">echo · get_time · add</text>
  <text x="801" y="330" text-anchor="middle" font-size="12" fill="#475569">Her oturum için ayrı</text>
  <text x="801" y="350" text-anchor="middle" font-size="12" fill="#475569">MCP süreci spawn edilir</text>

  <!-- NATS arrows -->
  <line x1="264" y1="264" x2="356" y2="240" stroke="#8b5cf6" stroke-width="2.5" marker-end="url(#arrowPurple)"/>
  <line x1="604" y1="240" x2="692" y2="152" stroke="#8b5cf6" stroke-width="2.5" marker-end="url(#arrowPurple)"/>
  <text x="310" y="230" text-anchor="middle" font-size="11" fill="#6d28d9">publish + inbox</text>
  <text x="650" y="180" text-anchor="middle" font-size="11" fill="#6d28d9">subscribe</text>

  <text x="480" y="430" text-anchor="middle" font-size="13" fill="#475569">İstekler mcp.demo subject'ine publish edilir; yanıtlar istemcinin inbox subject'ine döner. API/IP yok, saf NATS.</text>

  <defs>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,3 L0,6 Z" fill="#3b82f6"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,3 L0,6 Z" fill="#22c55e"/>
    </marker>
    <marker id="arrowPurple" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,3 L0,6 Z" fill="#8b5cf6"/>
    </marker>
  </defs>
</svg>