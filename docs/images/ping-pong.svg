<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640" font-family="Segoe UI, Arial, sans-serif">
  <rect width="960" height="640" fill="#f8fafc"/>
  <text x="480" y="36" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">MCP over NATS — İstek / Cevap (ping-pong)</text>

  <!-- legend -->
  <line x1="640" y1="52" x2="676" y2="52" stroke="#f59e0b" stroke-width="2.5" marker-end="url(#arrowAmber)"/>
  <text x="684" y="56" font-size="12" fill="#b45309">istek (ping)</text>
  <line x1="790" y1="52" x2="826" y2="52" stroke="#22c55e" stroke-width="2.5" marker-end="url(#arrowGreen)"/>
  <text x="834" y="56" font-size="12" fill="#15803d">cevap (pong)</text>

  <!-- lifeline headers -->
  <rect x="40" y="64" width="180" height="52" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="130" y="86" text-anchor="middle" font-size="14" font-weight="600" fill="#0f172a">local-proxy.exe</text>
  <text x="130" y="104" text-anchor="middle" font-size="11" fill="#475569">İstemci PC</text>
  <rect x="290" y="64" width="180" height="52" rx="8" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="380" y="86" text-anchor="middle" font-size="14" font-weight="600" fill="#0f172a">NATS</text>
  <text x="380" y="104" text-anchor="middle" font-size="11" fill="#475569">subject: mcp.demo</text>
  <rect x="530" y="64" width="180" height="52" rx="8" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.5"/>
  <text x="620" y="86" text-anchor="middle" font-size="14" font-weight="600" fill="#0f172a">remote-bridge.exe</text>
  <text x="620" y="104" text-anchor="middle" font-size="11" fill="#475569">Uzak PC</text>
  <rect x="760" y="64" width="180" height="52" rx="8" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.5"/>
  <text x="850" y="86" text-anchor="middle" font-size="14" font-weight="600" fill="#0f172a">demo-server.exe</text>
  <text x="850" y="104" text-anchor="middle" font-size="11" fill="#475569">Uzak PC (child)</text>

  <!-- lifelines -->
  <line x1="130" y1="120" x2="130" y2="584" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="380" y1="120" x2="380" y2="584" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="620" y1="120" x2="620" y2="584" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="850" y1="120" x2="850" y2="584" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- REQUEST band -->
  <text x="40" y="152" font-size="13" font-weight="700" fill="#b45309">İSTEK (ping)</text>
  <line x1="130" y1="178" x2="376" y2="178" stroke="#f59e0b" stroke-width="2.5" marker-end="url(#arrowAmber)"/>
  <text x="255" y="170" text-anchor="middle" font-size="12" fill="#b45309">publish mcp.demo · reply=inbox</text>
  <text x="255" y="196" text-anchor="middle" font-size="11" font-family="Consolas, monospace" fill="#475569">[proxy] -&gt; NATS mcp.demo | id=2 method=tools/call add</text>

  <line x1="380" y1="232" x2="616" y2="232" stroke="#f59e0b" stroke-width="2.5" marker-end="url(#arrowAmber)"/>
  <text x="500" y="224" text-anchor="middle" font-size="12" fill="#b45309">bridge subject'i dinler</text>

  <line x1="620" y1="286" x2="846" y2="286" stroke="#f59e0b" stroke-width="2.5" marker-end="url(#arrowAmber)"/>
  <text x="735" y="278" text-anchor="middle" font-size="12" fill="#b45309">child stdin</text>
  <text x="735" y="304" text-anchor="middle" font-size="11" font-family="Consolas, monospace" fill="#475569">[remote] -&gt; child | id=2 method=tools/call add</text>

  <rect x="760" y="318" width="180" height="44" rx="6" fill="#ffffff" stroke="#22c55e" stroke-width="1.5"/>
  <text x="850" y="336" text-anchor="middle" font-size="11" font-family="Consolas, monospace" fill="#15803d">[demo] tool cagrildi: add</text>
  <text x="850" y="352" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">7 + 8 = 15</text>

  <!-- RESPONSE band -->
  <text x="40" y="392" font-size="13" font-weight="700" fill="#15803d">CEVAP (pong)</text>
  <line x1="850" y1="418" x2="624" y2="418" stroke="#22c55e" stroke-width="2.5" marker-end="url(#arrowGreen)"/>
  <text x="735" y="410" text-anchor="middle" font-size="12" fill="#15803d">child stdout</text>
  <text x="735" y="436" text-anchor="middle" font-size="11" font-family="Consolas, monospace" fill="#475569">[remote] &lt;- child | id=2 -&gt; inbox</text>

  <line x1="620" y1="470" x2="384" y2="470" stroke="#22c55e" stroke-width="2.5" marker-end="url(#arrowGreen)"/>
  <text x="500" y="462" text-anchor="middle" font-size="12" fill="#15803d">publish inbox</text>

  <line x1="380" y1="522" x2="134" y2="522" stroke="#22c55e" stroke-width="2.5" marker-end="url(#arrowGreen)"/>
  <text x="255" y="514" text-anchor="middle" font-size="12" fill="#15803d">inbox'e yanıt</text>
  <text x="255" y="540" text-anchor="middle" font-size="11" font-family="Consolas, monospace" fill="#475569">[proxy] &lt;- NATS yanit | id=2</text>

  <line x1="130" y1="574" x2="44" y2="574" stroke="#22c55e" stroke-width="2.5" marker-end="url(#arrowGreen)"/>
  <text x="87" y="566" text-anchor="middle" font-size="12" fill="#15803d">stdout → istemci</text>
  <text x="255" y="592" text-anchor="middle" font-size="11" font-family="Consolas, monospace" fill="#475569">{"id":2,"jsonrpc":"2.0","result":{"content":[{"text":"15"}]}}</text>

  <text x="480" y="622" text-anchor="middle" font-size="13" fill="#475569">Aynı id=2 iki tarafta: istek NATS'ten geçti, karşıda add çalıştı, yanıt döndü. API/IP yok, saf NATS.</text>

  <defs>
    <marker id="arrowAmber" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,3 L0,6 Z" fill="#f59e0b"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,3 L0,6 Z" fill="#22c55e"/>
    </marker>
  </defs>
</svg>